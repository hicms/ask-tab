name: Release Chrome extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chrome:
    runs-on: ubuntu-24.04
    env:
      ASKTAB_RELEASE_SERVICE_URL: ${{ vars.ASKTAB_RELEASE_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 10.11.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.15.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .example.env .env
      - name: Check release configuration
        run: |
          if [ -z "$ASKTAB_RELEASE_SERVICE_URL" ]; then
            echo 'Set the repository Actions variable ASKTAB_RELEASE_SERVICE_URL before tagging a release.' >&2
            exit 1
          fi
      - name: Build workspace packages for tests
        run: pnpm exec turbo ready
      - run: pnpm quality
      - name: Generate release notes from commits
        run: node scripts/generate-release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - name: Package Chrome extension
        run: pnpm release:package "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist-zip/asktab-chrome-$GITHUB_REF_NAME.zip" \
            "dist-zip/asktab-chrome-$GITHUB_REF_NAME.sha256" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

  webstore:
    name: Upload Chrome Web Store draft
    needs: chrome
    if: ${{ vars.CWS_UPLOAD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: chrome-webstore-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.11.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.15.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the published release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist-zip \
            --pattern "asktab-chrome-$GITHUB_REF_NAME.zip" \
            --pattern "asktab-chrome-$GITHUB_REF_NAME.sha256"
      - name: Upload package without submitting for review
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: node scripts/upload-webstore.mjs "$GITHUB_REF_NAME"
